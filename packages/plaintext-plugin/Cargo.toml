[workspace]

[package]
name = "plaintext-plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
grep-matcher = "0.1"
grep-regex = "0.1"
napi = { version = "3", features = ["async", "tokio_fs", "tokio_rt", "serde-json"] }
napi-derive = "3"
serde_json = "1"
utils = { path = "../utils" }

[build-dependencies]
napi-build = "2"

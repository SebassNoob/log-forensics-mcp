[workspace]

[package]
name = "journal-plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
grep-matcher = "0.1"
grep-regex = "0.1"
lz4_flex = "0.14.0"
lzma-rust2 = { version = "0.20.1", default-features = false, features = ["std", "xz"] }
napi = { version = "3", features = ["async", "tokio_fs", "tokio_rt", "serde-json"] }
napi-derive = "3"
ruzstd = "0.9.0"
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["fs", "io-util"] }
utils = { path = "../utils" }

[build-dependencies]
napi-build = "2"

name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # `fixed: [["*"]]` in .changeset/config.json versions every package in lockstep,
      # so one entry bumps the whole monorepo.
      - run: |
          cat > .changeset/release.md <<'EOF'
          ---
          "mcp": ${{ inputs.bump }}
          ---

          Release
          EOF

      - run: bunx changeset version
      - run: bun install --lockfile-only

      - id: version
        run: echo "version=$(bun -e 'console.log(require("./apps/mcp/package.json").version)')" >> "$GITHUB_OUTPUT"

      - env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # changesets only versions workspace packages, so sync the published root manifest.
          bun pm pkg set version="$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: release $VERSION"
          git tag -a "$VERSION" -m "$VERSION"
          git push --follow-tags

  build:
    needs: version
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-latest }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
          - { name: darwin-x64, runner: macos-15-intel }
          - { name: darwin-arm64, runner: macos-latest }
          - { name: windows-x64, runner: windows-latest, ext: .exe }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.version }}
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      # Each package under packages/ is its own Cargo workspace with its own target dir.
      - id: rust-workspaces
        shell: bash
        run: |
          {
            echo 'paths<<EOF'
            for f in packages/*/Cargo.toml; do dirname "$f"; done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.rust-workspaces.outputs.paths }}
          key: ${{ matrix.name }}

      - run: bun install --frozen-lockfile

      # Builds each .node addon for the host, then embeds them via `bun build --compile`.
      # No cross-compilation: the runner architecture is the release target.
      - run: bun run bundle

      - run: mv dist/log-forensics-mcp${{ matrix.ext }} dist/log-forensics-mcp-${{ matrix.name }}${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: log-forensics-mcp-${{ matrix.name }}
          path: dist/log-forensics-mcp-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
